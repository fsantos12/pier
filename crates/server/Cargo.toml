[package]
name = "pier-server"
description = "Pier HTTP server: REST API, auth, SQLite store and embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "pier"
path = "src/main.rs"

[dependencies]
pier-core = { path = "../core" }
pier-api-types = { path = "../api-types", features = ["openapi"] }
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "original-uri"] }
base64 = "0.22"
mime_guess = "2"
rand = "0.9"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio.workspace = true
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"

[dev-dependencies]
pier-core = { path = "../core", features = ["test-util"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
