[package]
name = "pier-core"
description = "Pier domain types and Docker wrapper (no HTTP, no database)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-memory `FakeDocker` for tests of this crate and of downstream crates.
test-util = []

[dependencies]
# `ssl` enables tcp+tls (rustls); default features give unix sockets, named pipes and plain http.
bollard = { version = "0.21", features = ["ssl"] }
async-trait = "0.1"
futures-util = "0.3"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Only the async mutex behind the per-name create locks; the runtime stays the caller's choice.
tokio = { version = "1", default-features = false, features = ["sync"] }

# ssh transport shells out to the system `ssh` binary and is only available on unix.
[target.'cfg(unix)'.dependencies]
bollard = { version = "0.21", features = ["ssl", "ssh"] }

[dev-dependencies]
proptest = "1"
tokio = { workspace = true }
